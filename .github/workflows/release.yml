name: Release Windows exe

# A standalone PORTABLE GenesisCA.exe (no installer) is cut on a version TAG (not
# every master push) so the Releases page stays clean and CI minutes aren't burned
# per-commit. The PWA on GitHub Pages keeps deploying on every master push
# (deploy.yml). The version is bumped only at release time (single source of
# truth: package.json — Tauri reads it via tauri.conf.json "version":
# "../package.json"), so the online app and the latest exe always report the SAME
# version.
#
# The release BODY is built from CHANGELOG.md: the "## [X.Y.Z]" section matching
# the tag becomes the notes. If that section is missing, an auto changelog is
# generated from git history since the previous tag (so a release is never blank).
# A modernized download/browser footer is always appended.
#
# To cut a release:
#   1. /updateversion <major|minor|patch> commit   (bumps package.json etc. AND writes the
#      "## [X.Y.Z]" CHANGELOG.md section from the commits since the last release, then
#      commits it — review/tweak that section if you like)
#   2. merge to master
#   3. push a matching tag, e.g.  git tag v1.25.0 && git push origin v1.25.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:           # manual run: the tag must be given explicitly, or
    inputs:                    # the release would be named after the branch ref
      tag:
        description: 'Release tag, e.g. v1.25.0'
        required: true

permissions:
  contents: write              # create the GitHub Release + upload the exe asset

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history + tags — the changelog fallback and the
                               # previous-tag diff need more than the default shallow clone.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # NO Rust build cache here, on purpose. Tauri embeds the web frontend INTO
      # the binary at compile time (generate_context!); a restored `target/` cache
      # can let cargo skip the recompile that re-embeds it, shipping a STALE UI in
      # the exe even when the source is current (GitHub Pages never hits this — it
      # rebuilds dist/ fresh; only the native embed does). Releases are infrequent,
      # so a clean build guarantees the exe matches the tagged source. (v1.19.0 hit
      # exactly this: correct source, stale embedded frontend.)
      - run: npm ci
      # Builds the frontend (beforeBuildCommand) + the native binary, WITHOUT any
      # installer bundle (--no-bundle; bundle.active is also false in tauri.conf).
      # Output: src-tauri/target/release/genesisca.exe (the Cargo package name).
      - run: npm run tauri build -- --no-bundle
      # Rename to the tag so a downloaded file is self-identifying. Glob the
      # top-level exe so this survives any Tauri binary-name change.
      - name: Stage portable exe
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $src = Get-ChildItem src-tauri/target/release/*.exe |
                 Where-Object { $_.Name -notlike '*setup*' } | Select-Object -First 1
          if (-not $src) { throw "No exe found in src-tauri/target/release" }
          Copy-Item $src.FullName "GenesisCA-$tag.exe" -Force
          Write-Host "Staged GenesisCA-$tag.exe from $($src.Name)"

      # Build release-notes.md: the curated CHANGELOG.md section for this version if
      # present, else an auto changelog grouped by conventional-commit prefix, then a
      # modernized download/browser footer. Passed to the release via body_path.
      - name: Compose release notes
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $repo = "${{ github.repository }}"
          $notes = ""

          # 1. Curated section from CHANGELOG.md: "## [1.25.0] ..." up to the next "## ".
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s*\[?$([regex]::Escape($version))\]?(\s|\]|$)") { $start = $i + 1; break }
            }
            if ($start -ge 0) {
              $buf = @()
              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s') { break }
                $buf += $lines[$i]
              }
              $notes = ($buf -join "`n").Trim()
            }
          }

          # 2. Fallback: grouped auto changelog since the previous tag.
          if (-not $notes) {
            Write-Host "No CHANGELOG.md section for $version — generating from git history."
            $prev = (git describe --tags --abbrev=0 "$tag^" 2>$null)
            if ($prev) { $prev = $prev.Trim() }
            $range = if ($prev) { "$prev..$tag" } else { $tag }
            $subjects = @(git log $range --no-merges --pretty=format:"%s" |
                          Where-Object { $_ -notmatch '^chore: bump version' })
            $buckets = [ordered]@{ 'Features' = '^feat'; 'Fixes' = '^fix'; 'Performance' = '^perf' }
            $out = @()
            $claimed = @()
            foreach ($b in $buckets.Keys) {
              $hits = @($subjects | Where-Object { $_ -match $buckets[$b] })
              if ($hits.Count) {
                $out += "### $b"
                $out += ($hits | ForEach-Object { "- " + ($_ -replace '^\w+(\([^)]*\))?:\s*', '') })
                $out += ""
                $claimed += $hits
              }
            }
            $rest = @($subjects | Where-Object { $claimed -notcontains $_ })
            if ($rest.Count) { $out += "### Other"; $out += ($rest | ForEach-Object { "- $_" }); $out += "" }
            $notes = ($out -join "`n").Trim()
            if ($prev) { $notes += "`n`n**Full changelog:** https://github.com/$repo/compare/$prev...$tag" }
          }

          # 3. Modernized download / browser footer (always appended).
          $footer = @"
---

### Download & run (Windows)
Grab **``GenesisCA-$tag.exe``** from the Assets below and run it — no installer, no admin, runs from anywhere (even a USB stick). It's unsigned, so the first launch shows a Windows SmartScreen prompt: click **More info -> Run anyway**.

### Or run it in your browser
No download needed — open **https://genesisca.online** and (optionally) install it as an app from there via the **Install** button. Same version, always up to date.
"@

          $full = "$notes`n`n$footer"
          $full | Out-File release-notes.md -Encoding utf8
          Write-Host "----- release-notes.md -----"
          Get-Content release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 'GenesisCA ${{ github.event.inputs.tag || github.ref_name }}'
          body_path: release-notes.md
          files: GenesisCA-*.exe
          draft: false
          prerelease: false
