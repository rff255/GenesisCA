<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenesisCA</title>
  </head>
  <body>
    <script>
      // Set the theme attribute synchronously before first paint to avoid a
      // flash. Default to "nocturne"; subsequent visits respect the value
      // ThemeSwitcher persisted to localStorage. Unknown/stale values fall
      // back to "nocturne" so `[data-theme=…]` always resolves to a real block.
      (function () {
        try {
          var t = localStorage.getItem('genesisca_theme');
          document.documentElement.dataset.theme =
            (t === 'blender' || t === 'nocturne') ? t : 'nocturne';
        } catch (e) {
          document.documentElement.dataset.theme = 'nocturne';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
