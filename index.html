<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenesisCA</title>
    <!-- Icons use %BASE_URL% so they resolve under '/' (dev / Tauri) and
         '/GenesisCA/' (GitHub Pages) without branching. The PWA <link rel="manifest">
         is injected by vite-plugin-pwa — do not add it here. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#e8a13a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GenesisCA" />
    <style>
      /* Dark base so there's never a white flash before React paints, on any
         theme (Nocturne is default; Blender is also dark-on-app-bg). */
      html, body { margin: 0; background: #0c0d10; }
      /* Boot splash: lives in the static HTML so it shows the instant the page
         parses — i.e. during the JS download + React mount gap that used to be a
         blank white screen. App.tsx fades + removes #splash once it has mounted. */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0c0d10;
        transition: opacity 0.35s ease;
      }
      #splash.splash-hide { opacity: 0; pointer-events: none; }
      .splash-inner {
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .splash-mark { animation: splashPulse 1.6s ease-in-out infinite; }
      .splash-word {
        color: #ecebe6; font-size: 18px; font-weight: 600; letter-spacing: 0.08em;
      }
      .splash-bar {
        width: 120px; height: 3px; border-radius: 3px;
        background: #26282e; overflow: hidden;
      }
      .splash-bar span {
        display: block; width: 40%; height: 100%; border-radius: 3px;
        background: #e8a13a; animation: splashSlide 1.1s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1);    opacity: 0.85; }
        50%      { transform: scale(1.08); opacity: 1; }
      }
      @keyframes splashSlide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark, .splash-bar span { animation: none; }
      }
    </style>
  </head>
  <body>
    <script>
      // Set the theme attribute synchronously before first paint to avoid a
      // flash. Default to "nocturne"; subsequent visits respect the value
      // ThemeSwitcher persisted to localStorage. Unknown/stale values fall
      // back to "nocturne" so `[data-theme=…]` always resolves to a real block.
      (function () {
        try {
          var t = localStorage.getItem('genesisca_theme');
          document.documentElement.dataset.theme =
            (t === 'blender' || t === 'nocturne') ? t : 'nocturne';
        } catch (e) {
          document.documentElement.dataset.theme = 'nocturne';
        }
      })();
    </script>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <svg class="splash-mark" width="76" height="76" viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <radialGradient id="splashCell" cx="36%" cy="30%" r="78%">
              <stop offset="0" stop-color="#f8c96e" />
              <stop offset="0.58" stop-color="#e8a13a" />
              <stop offset="1" stop-color="#c9801f" />
            </radialGradient>
            <radialGradient id="splashNuc" cx="38%" cy="34%" r="72%">
              <stop offset="0" stop-color="#fff3d6" />
              <stop offset="1" stop-color="#f0bf72" />
            </radialGradient>
          </defs>
          <circle cx="176" cy="256" r="126" fill="url(#splashCell)" />
          <circle cx="336" cy="256" r="126" fill="url(#splashCell)" />
          <circle cx="336" cy="256" r="126" fill="none" stroke="#a8640f" stroke-opacity="0.45" stroke-width="5" />
          <circle cx="150" cy="242" r="33" fill="url(#splashNuc)" />
          <circle cx="362" cy="242" r="33" fill="url(#splashNuc)" />
        </svg>
        <div class="splash-word">GenesisCA</div>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
