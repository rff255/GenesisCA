<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenesisCA</title>
    <!-- Icons use %BASE_URL% so they resolve under '/' (dev / Tauri) and
         '/GenesisCA/' (GitHub Pages) without branching. The PWA <link rel="manifest">
         is injected by vite-plugin-pwa — do not add it here. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#e8a13a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GenesisCA" />
  </head>
  <body>
    <script>
      // Set the theme attribute synchronously before first paint to avoid a
      // flash. Default to "nocturne"; subsequent visits respect the value
      // ThemeSwitcher persisted to localStorage. Unknown/stale values fall
      // back to "nocturne" so `[data-theme=…]` always resolves to a real block.
      (function () {
        try {
          var t = localStorage.getItem('genesisca_theme');
          document.documentElement.dataset.theme =
            (t === 'blender' || t === 'nocturne') ? t : 'nocturne';
        } catch (e) {
          document.documentElement.dataset.theme = 'nocturne';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
