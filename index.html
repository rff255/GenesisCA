    <script>
      // Pin the theme to "blender" — the only shipped theme for now. Future
      // theme additions will bring back a selector + persisted preference;
      // until then the attribute is set unconditionally so `[data-theme=…]`
      // CSS still resolves identically to `:root`.
      document.documentElement.dataset.theme = 'blender';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
